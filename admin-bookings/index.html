<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Bookings</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="/styles.css">
<style>
  .admin-booking-card{background:var(--bg-panel);border:1px solid var(--line-silver);border-radius:4px;padding:18px 20px;margin-bottom:12px;}
  .admin-booking-top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .admin-booking-type{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gold-soft);}
  .admin-booking-ref{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ivory-dim);}
  .admin-booking-summary{font-size:15px;margin-bottom:6px;}
  .admin-booking-meta{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ivory-dim);display:flex;gap:16px;flex-wrap:wrap;}
  .admin-booking-price{color:var(--gold-soft);font-weight:600;}
</style>
<meta name="description" content="Internal admin dashboard.">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="canonical" href="https://eliteorbits.com/admin-bookings/">
<meta property="og:site_name" content="Elite Orbits">
<meta property="og:title" content="Admin — Bookings">
<meta property="og:description" content="Internal admin dashboard.">
<meta property="og:url" content="https://eliteorbits.com/admin-bookings/">
<meta property="og:type" content="website">
<meta property="og:image" content="/assets/logo-mark.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Admin — Bookings">
<meta name="twitter:description" content="Internal admin dashboard.">
<meta name="author" content="Elite Orbits">
</head>
<body>

<header>
  <nav>
    <div class="logo">
      <span class="logo-mark"><img src="/assets/logo-mark.png" alt="Elite Orbits" style="width:100%;height:100%;object-fit:contain;"></span>
      Elite Orbits
    </div>
    <div class="nav-links" style="max-height:none;position:static;background:none;border:none;">
      <a href="/">Back to site</a>
    </div>
  </nav>
</header>

<section class="page-hero" style="padding-bottom:32px;">
  <div class="wrap">
    <h1>All bookings</h1>
    <p>Private page — every flight, stay and car rental booked by customers, across all accounts.</p>
  </div>
</section>

<section style="padding-top:12px;">
  <div class="wrap" style="max-width:760px;">

    <div class="search-panel" style="margin-bottom:28px;">
      <div class="form-row">
        <label for="adminKey">Admin key</label>
        <input type="password" id="adminKey" placeholder="Paste your ADMIN_KEY from the backend .env">
      </div>
      <button id="loadBtn" class="btn-primary" style="margin-top:10px;">Load bookings</button>
      <p class="form-note">This key is set in <code>backend/.env</code> as <code>ADMIN_KEY</code>. It's only used in this browser tab, never saved.</p>
    </div>

    <p class="results-status" id="status"></p>
    <div id="bookingList"></div>
  </div>
</section>

<footer>
  <div class="wrap footer-bottom" style="border-top:1px solid var(--line-silver);margin-top:40px;">
    <span>© 2026 Elite Orbits — internal page</span>
  </div>
</footer>

<script src="/app.js"></script>
<script>
  const TYPE_LABEL2 = { flight: 'Flight', stay: 'Stay', car: 'Car Rental' };
  const CURRENCY_SYMBOL3 = { INR: '₹', USD: '$', CAD: 'C$' };

  function summarizeAdmin(b) {
    const d = b.details || {};
    if (b.type === 'flight') return `${d.from || '?'} → ${d.to || '?'}${d.airline ? ' · ' + d.airline : ''}`;
    if (b.type === 'stay') return `${d.name || d.city || 'Stay'}${d.city && d.name ? ' · ' + d.city : ''}`;
    if (b.type === 'car') return `${d.category || 'Car'}${d.city ? ' · ' + d.city : ''}`;
    return TYPE_LABEL2[b.type] || b.type;
  }

  async function loadBookings() {
    const adminKey = document.getElementById('adminKey').value.trim();
    const status = document.getElementById('status');
    const list = document.getElementById('bookingList');
    if (!adminKey) {
      status.textContent = 'Enter your admin key first.';
      return;
    }
    status.textContent = 'Loading…';
    try {
      const res = await fetch(`${API_BASE_URL}/bookings/admin/all`, {
        headers: { 'X-Admin-Key': adminKey },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not load bookings.');

      if (!data.bookings.length) {
        list.innerHTML = '';
        status.textContent = 'No bookings yet.';
        return;
      }

      status.textContent = `${data.count} booking(s) total.`;
      list.innerHTML = data.bookings.map(b => `
        <div class="admin-booking-card">
          <div class="admin-booking-top">
            <span class="admin-booking-type">${TYPE_LABEL2[b.type] || b.type}</span>
            <span class="admin-booking-ref">${b.reference}</span>
          </div>
          <div class="admin-booking-summary">${summarizeAdmin(b)}</div>
          <div class="admin-booking-meta">
            <span>${b.customer_name} · ${b.customer_email}</span>
            <span class="admin-booking-price">${CURRENCY_SYMBOL3[b.currency] || ''}${b.price}</span>
            <span>${new Date(b.created_at).toLocaleString('en-IN')}</span>
          </div>
        </div>
      `).join('');
    } catch (err) {
      status.textContent = err.message.includes('fetch')
        ? "Couldn't reach the backend. Make sure the server is running."
        : err.message;
    }
  }

  document.getElementById('loadBtn').addEventListener('click', loadBookings);
</script>

</body>
</html>
