<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Elite Orbits</title>
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <nav>
    <div class="logo">
      <span class="logo-mark"><img src="assets/logo-mark.png" alt="Elite Orbits" style="width:100%;height:100%;object-fit:contain;"></span>
      Elite Orbits
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
    <div class="nav-links" id="navLinks">
      <a href="flights.html">Flights</a>
      <a href="stays.html">Stays</a>
      <a href="cars.html">Car Rentals</a>
      <a href="about.html">About</a>
      <a href="faq.html">FAQ</a>
      <a href="contact.html">Contact</a>
      <a class="nav-cta" href="signup.html">Sign Up</a>
    </div>
  </nav>
</header>

<section class="page-hero" style="padding-bottom:56px;">
  <div class="wrap auth-wrap">
    <span class="crumb"><a href="index.html">Home</a> / Log in</span>
    <div class="auth-panel" style="margin-top:24px;">
      <h2>Welcome back</h2>
      <p class="sub-line">Log in to see your bookings and member pricing.</p>

      <div class="auth-error" id="authError"></div>

      <form id="loginForm">
        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@example.com">
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Your password">
        </div>
        <button type="submit" class="btn-primary" style="width:100%;justify-content:center;border:none;cursor:pointer;">Log in →</button>
      </form>

      <div class="auth-switch">New to Elite Orbits? <a href="signup.html">Create an account</a></div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap footer-social" id="footerSocial"></div>
  <div class="wrap footer-bottom" style="border-top:none;margin-top:0;">
    <span>© 2026 Elite Orbits</span>
    <span><a href="terms.html">Terms</a> · <a href="privacy.html">Privacy</a> · <a href="cancellation-policy.html">Cancellation</a> · <a href="booking-policy.html">Booking</a> · <a href="cookie-policy.html">Cookies</a></span>
  </div>
</footer>

<script src="app.js"></script>
<script>
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('authError');
  const nextParam = new URLSearchParams(window.location.search).get('next');
  if (nextParam) {
    const switchLink = document.querySelector('.auth-switch a');
    if (switchLink) switchLink.href = `signup.html?next=${encodeURIComponent(nextParam)}`;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in…';

    try {
      const res = await fetch(`${API_BASE_URL}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not log in.');

      localStorage.setItem('eo_token', data.token);
      localStorage.setItem('eo_user', JSON.stringify(data.user));
      const next = new URLSearchParams(window.location.search).get('next');
      window.location.href = next || 'index.html';
    } catch (err) {
      errorBox.textContent = err.message.includes('fetch')
        ? "Couldn't reach the backend. It may be waking up from sleep (free Render instances take ~50s after inactivity) — try again in a moment."
        : err.message;
      errorBox.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log in →';
    }
  });
</script>

</body>
</html>
